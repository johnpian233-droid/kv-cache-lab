name: Report a measurement
description: Share a slope from your own GPU so it can be added to the community table.
title: "[measurement] <GPU> — <slope> KiB/token, <KV type>"
labels: ["measurement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for measuring. Numbers are *supposed* to disagree — that is the point.

        Before posting, please run `python tests/test_fit.py` once. It only re-derives the
        arithmetic from the committed CSVs, so if it fails on your machine the problem is
        the repo, not your GPU.

  - type: input
    id: gpu
    attributes:
      label: GPU
      description: Output of `nvidia-smi --query-gpu=name,memory.total --format=csv`
      placeholder: "NVIDIA GeForce RTX 4060 Laptop GPU, 8188 MiB"
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model and quantization
      description: Ollama tag including the quant suffix, if any.
      placeholder: "qwen2.5:1.5b (Q4_K_M)"
    validations:
      required: true

  - type: dropdown
    id: kvtype
    attributes:
      label: KV cache type
      options:
        - f16
        - q8_0
        - q4_0
        - other (describe below)
    validations:
      required: true

  - type: input
    id: ollama
    attributes:
      label: Ollama version
      description: Output of `ollama --version`
      placeholder: "0.40.6"
    validations:
      required: true

  - type: input
    id: slope
    attributes:
      label: Measured slope
      description: Copied from the `[fit]` line the script prints.
      placeholder: "29.99 KiB/token (plain line: 32.11 +/- 1.24)"
    validations:
      required: true

  - type: input
    id: step
    attributes:
      label: Step, if any
      description: |
        Copied from the `[step]` block the script prints — location, height, and F.
        Write "none" if the script said the step does not earn its parameter. This is
        the field most reports will leave blank and the one that decides whether the
        step is a property of Ollama or a property of this one machine.
      placeholder: "+67.1 MiB at num_ctx=8192, F=2748"
    validations:
      required: false

  - type: input
    id: idle
    attributes:
      label: Idle baseline drift
      description: |
        Copied from the `[idle]` line the script prints, e.g. "1230 -> 1229, spread 1 MiB".
        This field exists because v0.1.3 found a 26 MiB drift inside one of its own runs,
        which moved that run's slope by 4.5% — more than the effect it was measuring. A
        report without this line cannot be compared with one that has it.
      placeholder: "823 -> 797, spread 26 MiB"
    validations:
      required: true

  - type: textarea
    id: csv
    attributes:
      label: CSV
      description: Paste the contents of `ollama_probe_<tag>.csv`.
      render: csv
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything unusual
      description: Background apps, a step in the curve, a driver quirk — all useful.
    validations:
      required: false
